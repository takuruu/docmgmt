[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmgmt"
version = "0.1.0"
description = "Dokumentanalyse und automatische Datei-Umbenennung per Mistral-API"
requires-python = ">=3.9"
dependencies = [
    "mistralai>=1.0.0",
    "PySide6>=6.6",
]

[project.scripts]
docmgmt-gui = "docmgmt.gui:main"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
